name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build (Docker)
        run: docker build -t ${{ github.event.repository.name }}:pr .

  # Portão único do CI: o conjunto de regras «CI obrigatório» da organização exige este job no
  # merge para a main. Passa só se todos os jobs acima passaram (pulado conta como ok).
  ci:
    name: CI
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Todos os jobs do CI passaram
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          case " $RESULTADOS " in
            *" failure "* | *" cancelled "*)
              echo "::error::Algum job do CI falhou ou foi cancelado."
              exit 1
              ;;
          esac
